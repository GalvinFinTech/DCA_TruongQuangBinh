<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DCA Wealth Intelligence - Chứng Khoán Yuanta Việt Nam</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts - Plus Jakarta Sans & JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              DEFAULT: '#c8ff00', // Signature Lime Electro
              light: '#d8ff4d',
              emerald: '#10b981',
              glow: 'rgba(200, 255, 0, 0.25)',
              dark: '#050608',
              card: '#0c0f17',
              cardHover: '#121724',
              border: '#1a2030',
              borderLight: '#263048',
              textMuted: '#64748b'
            }
          }
        }
      }
    }
  </script>
  
  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #050608;
    }
    ::-webkit-scrollbar-thumb {
      background: #1a2030;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #c8ff00;
    }
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
    }
    input[type=range]:focus {
      outline: none;
    }
    
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(200, 255, 0, 0.15), inset 0 0 15px rgba(200, 255, 0, 0.05); }
      50% { box-shadow: 0 0 35px rgba(200, 255, 0, 0.3), inset 0 0 25px rgba(16, 185, 129, 0.1); }
    }
    .premium-glow {
      animation: pulseGlow 4s infinite ease-in-out;
    }
    .glass-card {
      background: linear-gradient(135deg, rgba(12, 15, 23, 0.92) 0%, rgba(5, 6, 8, 0.96) 100%);
      backdrop-filter: blur(14px);
    }
    .lime-gradient-text {
      background: linear-gradient(135deg, #c8ff00 0%, #34d399 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="bg-[#030406] text-[#f1f5f9] antialiased min-h-screen selection:bg-brand selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const { AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid } = Recharts;

    const fmt = (n) =>
      new Intl.NumberFormat("vi-VN", { style: "currency", currency: "VND", maximumFractionDigits: 0 }).format(n);

    const fmtShort = (n) => {
      if (n >= 1_000_000_000) return `${(n / 1_000_000_000).toFixed(1)} tỷ`;
      if (n >= 1_000_000) return `${(n / 1_000_000).toFixed(0)} tr`;
      if (n >= 1_000) return `${(n / 1_000).toFixed(0)}k`;
      return n.toString();
    };

    const formatRawNumber = (numStr) => {
      const clean = numStr.replace(/\D/g, "");
      if (!clean) return "";
      return new Intl.NumberFormat("vi-VN").format(parseInt(clean, 10));
    };

    const parseFormattedNumber = (formattedStr) => {
      return parseInt(formattedStr.replace(/\./g, "").replace(/,/g, ""), 10) || 0;
    };

    const calcRequiredMonthly = (targetValue, annualRate, months) => {
      const r = annualRate / 100 / 12;
      if (r === 0) return targetValue / months;
      return (targetValue * r) / (((Math.pow(1 + r, months) - 1)) * (1 + r));
    };

    const CustomTooltip = ({ active, payload, label }) => {
      if (active && payload && payload.length) {
        const invested = payload[0]?.value || 0;
        const gain = payload[1]?.value || 0;
        const total = invested + gain;
        return (
          <div className="bg-[#080b12]/95 backdrop-blur-xl border border-brand/50 rounded-xl p-3.5 shadow-[0_20px_40px_rgba(0,0,0,0.9)] font-mono text-xs max-w-[280px] z-50">
            <div className="text-zinc-400 mb-2 font-semibold border-b border-zinc-800 pb-1.5 flex justify-between items-center">
              <span>Cột mốc thời gian</span>
              <span className="text-black font-bold bg-brand px-2 py-0.5 rounded">Tháng {label}</span>
            </div>
            <div className="text-brand mb-1.5 font-bold flex justify-between items-center text-sm">
              <span>TỔNG TÀI SẢN:</span>
              <span>{fmt(total)}</span>
            </div>
            <div className="text-[#34d399] mb-1 flex justify-between items-center">
              <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-[#34d399]"></span> Lãi kép:</span>
              <span className="font-semibold">+{fmt(gain)}</span>
            </div>
            <div className="text-zinc-400 flex justify-between items-center">
              <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-zinc-500"></span> Vốn thực nộp:</span>
              <span>{fmt(invested)}</span>
            </div>
          </div>
        );
      }
      return null;
    };

    // Enhanced Custom Data Point Callout Marker at the end of the line chart
    const CustomLastPointDot = (props) => {
      const { cx, cy, index, dataLength, payload } = props;
      if (index === dataLength - 1 && cx && cy) {
        const totalVal = (payload.invested || 0) + (payload.gain || 0);
        return (
          <g key={`last-point-${index}`}>
            {/* Outer Pulsing Glow */}
            <circle cx={cx} cy={cy} r={10} fill="#c8ff00" fillOpacity={0.35} className="animate-ping" />
            <circle cx={cx} cy={cy} r={6} fill="#c8ff00" stroke="#000000" strokeWidth={2.5} />
            
            {/* Floating Data Badge Callout Box */}
            <g transform={`translate(${cx > 220 ? cx - 130 : cx + 15}, ${cy > 60 ? cy - 45 : cy + 15})`}>
              <rect 
                width={125} 
                height={34} 
                rx={8} 
                fill="#080b12" 
                stroke="#c8ff00" 
                strokeWidth={1.8} 
                className="shadow-[0_0_20px_rgba(200,255,0,0.6)]"
              />
              <text x={62.5} y={14} textAnchor="middle" fill="#94a3b8" fontSize={8.5} fontFamily="JetBrains Mono" fontWeight="bold">
                🎯 ĐÍCH ĐẾN TÀI SẢN
              </text>
              <text x={62.5} y={27} textAnchor="middle" fill="#c8ff00" fontSize={11} fontFamily="JetBrains Mono" fontWeight="extrabold">
                {fmtShort(totalVal)}
              </text>
            </g>
          </g>
        );
      }
      return null;
    };

    const PremiumSliderInput = ({ label, value, onChange, min, max, step, valueSuffix = "", isCurrency = false, presets = [] }) => {
      const [isEditing, setIsEditing] = useState(false);
      const [inputValue, setInputValue] = useState("");

      useEffect(() => {
        if (!isEditing) {
          setInputValue(isCurrency ? formatRawNumber(value.toString()) : value.toString());
        }
      }, [value, isEditing, isCurrency]);

      const pct = Math.min(100, Math.max(0, ((value - min) / (max - min)) * 100));

      const handleInputChange = (e) => {
        const rawText = e.target.value;
        if (isCurrency) {
          const cleanText = rawText.replace(/\D/g, "");
          setInputValue(formatRawNumber(cleanText));
        } else {
          setInputValue(rawText.replace(/[^0-9.]/g, ""));
        }
      };

      const handleBlur = () => {
        setIsEditing(false);
        let numericValue = isCurrency ? parseFormattedNumber(inputValue) : parseFloat(inputValue);
        if (isNaN(numericValue)) numericValue = min;
        const boundedValue = Math.min(max, Math.max(min, numericValue));
        onChange(boundedValue);
      };

      return (
        <div className="mb-5 group">
          <div className="flex justify-between items-center mb-2">
            <span className="text-zinc-400 text-xs font-bold tracking-wider uppercase font-mono group-hover:text-brand transition-colors">
              {label}
            </span>
            <div className="flex items-center gap-1.5 bg-[#0a0e18] border border-brand/30 rounded-xl px-2.5 py-1 focus-within:border-brand focus-within:ring-2 focus-within:ring-brand/20 transition-all shadow-inner">
              <input 
                type="text" 
                value={inputValue}
                onChange={handleInputChange}
                onFocus={() => setIsEditing(true)}
                onBlur={handleBlur}
                className="bg-transparent text-brand text-right font-extrabold font-mono text-sm sm:text-base focus:outline-none w-32"
              />
              <span className="text-zinc-400 font-semibold font-mono text-xs">{valueSuffix}</span>
            </div>
          </div>
          
          <div className="relative h-2 bg-[#101524] rounded-full flex items-center my-2.5">
            <div 
              style={{ width: `${pct}%` }} 
              className="absolute left-0 h-full bg-gradient-to-r from-brand/40 via-brand/80 to-brand rounded-full"
            />
            <input 
              type="range" 
              min={min} 
              max={max} 
              step={step} 
              value={value}
              onChange={e => onChange(Number(e.target.value))}
              className="absolute w-full h-5 opacity-0 cursor-pointer z-10"
            />
            <div 
              style={{ left: `calc(${pct}% - 8px)` }} 
              className="absolute w-4 h-4 rounded-full bg-brand shadow-[0_0_15px_rgba(200,255,0,0.9)] pointer-events-none transition-transform group-hover:scale-125 border-2 border-black"
            />
          </div>

          {presets.length > 0 && (
            <div className="flex flex-wrap gap-1.5 mt-2.5">
              {presets.map((item) => {
                const pVal = typeof item === 'object' ? item.val : item;
                const isHighlight = typeof item === 'object' && item.highlight;
                const customLabel = typeof item === 'object' ? item.label : null;
                const isActive = value === pVal;

                let displayLabel = customLabel;
                if (!displayLabel) {
                  displayLabel = isCurrency 
                    ? fmtShort(pVal) 
                    : (valueSuffix === "tháng" ? (pVal >= 12 ? `${pVal/12} năm` : `${pVal}th`) : `${pVal}%`);
                }

                return (
                  <button
                    key={pVal}
                    onClick={() => onChange(pVal)}
                    className={`px-2 py-0.5 rounded-lg text-[11px] font-mono font-bold transition-all border ${
                      isActive 
                        ? "bg-brand text-black border-brand shadow-[0_0_12px_rgba(200,255,0,0.5)] scale-105" 
                        : isHighlight
                          ? "bg-emerald-950/80 text-brand border-brand/60 hover:border-brand shadow-[0_0_10px_rgba(200,255,0,0.2)]"
                          : "bg-[#0a0e1a] text-zinc-400 border-zinc-800 hover:bg-[#12182a] hover:text-white hover:border-zinc-700"
                    }`}
                  >
                    {isHighlight && !isActive && (
                      <span className="inline-block w-1.5 h-1.5 rounded-full bg-brand mr-1 animate-pulse" />
                    )}
                    {displayLabel}
                  </button>
                );
              })}
            </div>
          )}

          <div className="flex justify-between mt-1.5">
            <span className="text-zinc-600 text-[10px] font-mono">{isCurrency ? fmtShort(min) : min}</span>
            <span className="text-zinc-600 text-[10px] font-mono">{isCurrency ? fmtShort(max) : max}</span>
          </div>
        </div>
      );
    };

    function DCACalculator() {
      const [mode, setMode] = useState("forward");
      const [toast, setToast] = useState({ show: false, message: "" });

      // Forward Mode Inputs
      const [monthly, setMonthly] = useState(5000000);
      const [rate, setRate] = useState(18); // Default 18% VN-INDEX
      const [months, setMonths] = useState(120);

      // Reverse Mode Inputs
      const [targetValue, setTargetValue] = useState(2000000000);
      const [revRate, setRevRate] = useState(18);
      const [revMonths, setRevMonths] = useState(120);

      const showToast = (message) => {
        setToast({ show: true, message });
        setTimeout(() => setToast({ show: false, message: "" }), 3000);
      };

      // Presets with 15M, 25M, 30M and 18% VNINDEX Highlight
      const monthlyPresets = [1000000, 3000000, 5000000, 10000000, 15000000, 20000000, 25000000, 30000000];
      const ratePresets = [
        6, 8, 10, 12, 15, 
        { val: 18, label: "18% (VN-INDEX)", highlight: true }, 
        20, 25
      ];
      const targetPresets = [500000000, 1000000000, 2000000000, 5000000000, 10000000000];
      const monthPresets = [36, 60, 120, 180, 240, 360];

      // Calculations
      const forward = useMemo(() => {
        const monthlyRate = rate / 100 / 12;
        const points = [];
        const yearlyPoints = [];
        let balance = 0;
        
        for (let m = 1; m <= months; m++) {
          balance = (balance + monthly) * (1 + monthlyRate);
          const invested = monthly * m;
          const gain = balance - invested;
          
          if (m % Math.max(1, Math.floor(months / 50)) === 0 || m === months) {
            points.push({ month: m, invested: Math.round(invested), gain: Math.round(gain) });
          }

          if (m % 12 === 0 || m === months) {
            yearlyPoints.push({
              year: Math.ceil(m / 12),
              month: m,
              invested: Math.round(invested),
              gain: Math.round(gain),
              total: Math.round(balance),
              percentage: invested > 0 ? ((balance - invested) / invested) * 100 : 0
            });
          }
        }
        const finalInvested = monthly * months;
        const finalValue = balance;
        return { 
          data: points, 
          yearlyData: yearlyPoints,
          totalInvested: finalInvested, 
          totalValue: finalValue, 
          totalGain: finalValue - finalInvested, 
          gainPct: finalInvested > 0 ? ((finalValue - finalInvested) / finalInvested) * 100 : 0 
        };
      }, [monthly, rate, months]);

      const reverse = useMemo(() => {
        const reqMonthly = calcRequiredMonthly(targetValue, revRate, revMonths);
        const monthlyRate = revRate / 100 / 12;
        const points = [];
        const yearlyPoints = [];
        let balance = 0;
        
        for (let m = 1; m <= revMonths; m++) {
          balance = (balance + reqMonthly) * (1 + monthlyRate);
          const invested = reqMonthly * m;
          const gain = balance - invested;
          
          if (m % Math.max(1, Math.floor(revMonths / 50)) === 0 || m === revMonths) {
            points.push({ month: m, invested: Math.round(invested), gain: Math.round(gain) });
          }

          if (m % 12 === 0 || m === revMonths) {
            yearlyPoints.push({
              year: Math.ceil(m / 12),
              month: m,
              invested: Math.round(invested),
              gain: Math.round(gain),
              total: Math.round(balance),
              percentage: invested > 0 ? ((balance - invested) / invested) * 100 : 0
            });
          }
        }
        const totalInvested = reqMonthly * revMonths;
        return { 
          reqMonthly, 
          totalInvested, 
          totalGain: targetValue - totalInvested, 
          gainPct: totalInvested > 0 ? ((targetValue - totalInvested) / totalInvested) * 100 : 0, 
          data: points,
          yearlyData: yearlyPoints
        };
      }, [targetValue, revRate, revMonths]);

      const durationFmt = (m) => {
        const y = Math.floor(m / 12);
        const rm = m % 12;
        return y > 0 ? `${y} năm${rm > 0 ? ` ${rm} th` : ""}` : `${m} tháng`;
      };

      const handleCopyReport = () => {
        let text = "";
        if (mode === "forward") {
          text = `[BÁO CÁO DCA - CHỨNG KHOÁN YUANTA VIỆT NAM]\n` +
                 `• Hình thức: Dự tính tích lũy tài sản\n` +
                 `• Đóng góp định kỳ: ${fmt(monthly)}/tháng (${durationFmt(months)})\n` +
                 `• Tỷ suất sinh lời kỳ vọng: ${rate}%/năm\n` +
                 `• Vốn thực nộp: ${fmt(forward.totalInvested)}\n` +
                 `• Tiền lãi kép: ${fmt(forward.totalGain)} (+${forward.gainPct.toFixed(1)}%)\n` +
                 `• TỔNG TÀI SẢN TƯƠNG LAI: ${fmt(forward.totalValue)}`;
        } else {
          text = `[BÁO CÁO DCA REVERSE - CHỨNG KHOÁN YUANTA VIỆT NAM]\n` +
                 `• Hình thức: Tính toán tích lũy ngược\n` +
                 `• Mục tiêu tài sản: ${fmt(targetValue)} (${durationFmt(revMonths)})\n` +
                 `• Tỷ suất sinh lời kỳ vọng: ${revRate}%/năm\n` +
                 `• Vốn dự kiến nộp: ${fmt(reverse.totalInvested)}\n` +
                 `• Lãi kép kỳ vọng: ${fmt(reverse.totalGain)} (+${reverse.gainPct.toFixed(1)}%)\n` +
                 `• SỐ TIỀN CẦN NỘP MỖI THÁNG: ${fmt(Math.round(reverse.reqMonthly))}/tháng`;
        }

        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);

        showToast("✓ Đã sao chép báo cáo tài chính thành công!");
      };

      const activeTotalValue = mode === "forward" ? forward.totalValue : targetValue;
      const activeTotalInvested = mode === "forward" ? forward.totalInvested : reverse.totalInvested;
      const activeTotalGain = mode === "forward" ? forward.totalGain : reverse.totalGain;
      const investedPct = activeTotalValue > 0 ? (activeTotalInvested / activeTotalValue) * 100 : 0;
      const gainPct = activeTotalValue > 0 ? (activeTotalGain / activeTotalValue) * 100 : 0;
      const activeYearlyData = mode === "forward" ? forward.yearlyData : reverse.yearlyData;

      return (
        <div className="flex flex-col items-center justify-center p-3 sm:p-5 lg:p-6 font-sans relative min-h-screen">
          
          {/* Toast Notification */}
          {toast.show && (
            <div className="fixed top-5 right-5 z-50 bg-[#091206] border border-brand/80 text-brand text-xs font-mono font-bold px-4 py-3 rounded-xl shadow-[0_15px_40px_rgba(0,0,0,0.9)] flex items-center gap-2.5 border-l-4 border-l-brand premium-glow">
              <span className="w-2 h-2 rounded-full bg-brand animate-ping" />
              <span>{toast.message}</span>
            </div>
          )}

          {/* Expanded Fluid Container (Up to 1650px) for maximum presentation real estate */}
          <div className="w-full max-w-[1650px] mx-auto">
            
            {/* Header Section */}
            <div className="flex flex-col md:flex-row md:items-center justify-between mb-5 pb-4 border-b border-zinc-800/80 gap-4">
              
              <div className="flex items-center gap-4">
                {/* White Glass Badge for Yuanta Logo Visibility */}
                <div className="bg-white/95 px-3.5 py-2 rounded-xl border border-white/50 shadow-[0_0_20px_rgba(255,255,255,0.25)] flex items-center justify-center">
                  <img 
                    src="logo-ysvn-vie-color.png" 
                    alt="Chứng Khoán Yuanta Việt Nam" 
                    className="h-8 sm:h-9 w-auto object-contain" 
                    onError={(e) => {
                      e.target.onerror = null;
                      e.target.parentElement.innerHTML = `<span class="text-blue-600 font-extrabold text-sm font-mono px-1">YUANTA SECURITIES</span>`;
                    }}
                  />
                </div>
                <div>
                  <div className="flex items-center gap-2 mb-0.5">
                    <span className="w-2 h-2 rounded-full bg-brand animate-pulse" />
                    <span className="text-zinc-400 font-mono text-[10px] sm:text-[11px] tracking-[0.15em] uppercase font-bold">
                      Sản phẩm thuộc về Chứng Khoán Yuanta Việt Nam
                    </span>
                  </div>
                  <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight text-white leading-tight">
                    DCA <span className="lime-gradient-text">Wealth Intelligence v3.0</span>
                  </h1>
                </div>
              </div>

              {/* Mode Selection Tab */}
              <div className="bg-[#0a0e1a] border border-brand/30 p-1 rounded-xl flex gap-1.5 w-full md:w-[380px] shadow-lg">
                <button 
                  onClick={() => setMode("forward")} 
                  className={`flex-1 py-2 px-3 text-center rounded-lg transition-all font-bold font-mono text-xs tracking-wider uppercase border ${
                    mode === "forward" 
                      ? "bg-brand text-black border-brand shadow-[0_2px_15px_rgba(200,255,0,0.4)]" 
                      : "bg-transparent text-zinc-400 border-transparent hover:text-white hover:bg-zinc-800/40"
                  }`}
                >
                  📈 Dự tính tích lũy
                </button>
                <button 
                  onClick={() => setMode("reverse")} 
                  className={`flex-1 py-2 px-3 text-center rounded-lg transition-all font-bold font-mono text-xs tracking-wider uppercase border ${
                    mode === "reverse" 
                      ? "bg-brand text-black border-brand shadow-[0_2px_15px_rgba(200,255,0,0.4)]" 
                      : "bg-transparent text-zinc-400 border-transparent hover:text-white hover:bg-zinc-800/40"
                  }`}
                >
                  🎯 Tích lũy ngược
                </button>
              </div>
            </div>

            {/* Main Interactive Grid */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
              
              {/* Left Column: Input Controls Panel (4 Columns) */}
              <div className="lg:col-span-4 glass-card border border-brand/25 rounded-2xl p-4 sm:p-5 shadow-[0_15px_50px_rgba(0,0,0,0.8)]">
                <div className="flex items-center justify-between mb-4 pb-2 border-b border-zinc-800/80">
                  <span className="text-xs font-mono font-bold uppercase tracking-wider text-brand flex items-center gap-2">
                    <span className="w-1.5 h-3 bg-brand rounded-full"></span> THÔNG SỐ ĐẦU VÀO
                  </span>
                  <span className="text-[10px] font-mono text-zinc-500">Tự động tính toán</span>
                </div>

                {mode === "forward" ? (
                  <>
                    <PremiumSliderInput 
                      label="Đóng góp định kỳ" 
                      value={monthly} 
                      onChange={setMonthly}
                      min={500000} 
                      max={100000000} 
                      step={500000} 
                      valueSuffix="VND"
                      isCurrency={true}
                      presets={monthlyPresets}
                    />

                    <PremiumSliderInput 
                      label="Tỷ suất sinh lời kỳ vọng" 
                      value={rate} 
                      onChange={setRate}
                      min={1} 
                      max={30} 
                      step={0.5} 
                      valueSuffix="%"
                      presets={ratePresets}
                    />

                    <PremiumSliderInput 
                      label="Thời gian tích lũy" 
                      value={months} 
                      onChange={setMonths}
                      min={6} 
                      max={360} 
                      step={6} 
                      valueSuffix="tháng"
                      presets={monthPresets}
                    />
                  </>
                ) : (
                  <>
                    <PremiumSliderInput 
                      label="Mục tiêu tài sản tích lũy" 
                      value={targetValue} 
                      onChange={setTargetValue}
                      min={100000000} 
                      max={50000000000} 
                      step={100000000} 
                      valueSuffix="VND"
                      isCurrency={true}
                      presets={targetPresets}
                    />

                    <PremiumSliderInput 
                      label="Tỷ suất sinh lời kỳ vọng" 
                      value={revRate} 
                      onChange={setRevRate}
                      min={1} 
                      max={30} 
                      step={0.5} 
                      valueSuffix="%"
                      presets={ratePresets}
                    />

                    <PremiumSliderInput 
                      label="Thời hạn thực hiện" 
                      value={revMonths} 
                      onChange={setRevMonths}
                      min={6} 
                      max={360} 
                      step={6} 
                      valueSuffix="tháng"
                      presets={monthPresets}
                    />
                  </>
                )}

                {/* Sub-metrics Summary Badges */}
                <div className="grid grid-cols-2 gap-3 mt-3 pt-3 border-t border-zinc-800/80">
                  <div className="bg-[#080d18] border border-brand/20 rounded-xl p-2.5">
                    <span className="text-zinc-500 text-[10px] tracking-wider uppercase font-mono font-bold block mb-0.5">Hiệu suất tài sản</span>
                    <span className="text-brand text-sm font-extrabold font-mono">
                      {mode === "forward" ? `+${forward.gainPct.toFixed(1)}%` : `+${reverse.gainPct.toFixed(1)}%`}
                    </span>
                  </div>
                  <div className="bg-[#080d18] border border-brand/20 rounded-xl p-2.5">
                    <span className="text-zinc-500 text-[10px] tracking-wider uppercase font-mono font-bold block mb-0.5">Thời gian dự kiến</span>
                    <span className="text-white text-sm font-extrabold font-mono">
                      {mode === "forward" ? durationFmt(months) : durationFmt(revMonths)}
                    </span>
                  </div>
                </div>

              </div>

              {/* Right Column: Hero Box + Large Roomy Chart & Detailed Table (8 Columns) */}
              <div className="lg:col-span-8 flex flex-col gap-5">
                
                {/* Hero Asset Card */}
                <div className="relative overflow-hidden rounded-2xl bg-gradient-to-br from-[#101b07] via-[#070910] to-[#040508] border border-brand/40 p-4 sm:p-5 shadow-[0_15px_40px_rgba(0,0,0,0.8)] premium-glow">
                  <div className="absolute top-0 right-0 w-48 h-48 bg-brand/10 rounded-full filter blur-[80px] pointer-events-none" />
                  
                  <div className="flex justify-between items-center mb-1">
                    <span className="text-zinc-400 text-xs tracking-wider uppercase font-mono font-bold flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-brand animate-pulse"></span>
                      {mode === "forward" ? "TỔNG TÀI SẢN TÍCH LŨY DỰ KIẾN" : "KHOẢN CẦN TÍCH LŨY MỖI THÁNG"}
                    </span>
                    <button 
                      onClick={handleCopyReport}
                      className="bg-[#0b1220] hover:bg-[#132038] text-brand border border-brand/40 px-3 py-1.5 rounded-lg text-xs font-mono transition-all flex items-center gap-1.5 active:scale-95 shadow font-bold"
                    >
                      <span>🗎 Copy Báo Cáo</span>
                    </button>
                  </div>

                  <div className="text-3xl sm:text-4xl lg:text-5xl font-black font-mono tracking-tight text-brand leading-none my-1.5">
                    {mode === "forward" ? fmt(forward.totalValue) : fmt(Math.round(reverse.reqMonthly))}
                  </div>

                  {mode === "reverse" && (
                    <div className="text-zinc-400 text-xs font-mono">
                      Cần nộp định kỳ để hoàn thành mục tiêu <span className="text-brand font-bold">{fmtShort(targetValue)}₫</span> sau {durationFmt(revMonths)}
                    </div>
                  )}

                  {/* Compound Interest Progress Bar */}
                  <div className="mt-3 pt-3 border-t border-zinc-800/80">
                    <div className="flex justify-between text-xs font-mono text-zinc-400 mb-1 font-semibold">
                      <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-zinc-500"></span> Vốn thực nộp: {fmtShort(activeTotalInvested)}</span>
                      <span className="text-brand flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-brand"></span> Lãi kép: {fmtShort(activeTotalGain)}</span>
                    </div>
                    <div className="h-2.5 w-full bg-zinc-950 rounded-full overflow-hidden flex border border-zinc-800 p-0.5">
                      <div style={{ width: `${investedPct}%` }} className="bg-zinc-500 rounded-l-full transition-all duration-500" />
                      <div style={{ width: `${gainPct}%` }} className="bg-gradient-to-r from-brand to-brand-light rounded-r-full transition-all duration-500" />
                    </div>
                    <div className="flex justify-between mt-1 text-xs font-mono">
                      <span className="text-zinc-400 font-semibold">{investedPct.toFixed(0)}% Vốn thực nộp</span>
                      <span className="text-brand font-bold">{gainPct.toFixed(0)}% Lãi kép đóng góp</span>
                    </div>
                  </div>
                </div>

                {/* Simultaneous Layout: Large Unclipped Chart + Yearly Table */}
                <div className="grid grid-cols-1 xl:grid-cols-12 gap-5">
                  
                  {/* Expanded Growth Chart Container with generous margins so data points are never obscured */}
                  <div className="xl:col-span-7 glass-card border border-brand/20 rounded-2xl p-4 shadow-[0_15px_40px_rgba(0,0,0,0.7)]">
                    <div className="flex justify-between items-center mb-3 pb-2 border-b border-zinc-800/80">
                      <span className="text-zinc-200 text-xs tracking-wider uppercase font-mono font-bold flex items-center gap-1.5">
                        <span className="w-1.5 h-3 bg-brand rounded-full"></span> BIỂU ĐỒ TĂNG TRƯỞNG TÀI SẢN
                      </span>
                      <div className="flex items-center gap-3 text-[11px] font-mono">
                        <span className="text-zinc-400 flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-zinc-500"></span>Vốn</span>
                        <span className="text-brand font-bold flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-brand"></span>Lãi kép</span>
                      </div>
                    </div>

                    {/* Roomy height container with ample top/right margin for data callout badge */}
                    <div className="h-[320px] sm:h-[350px] w-full pt-1">
                      <ResponsiveContainer width="100%" height="100%">
                        <AreaChart 
                          data={mode === "forward" ? forward.data : reverse.data} 
                          margin={{ top: 52, right: 45, left: 0, bottom: 5 }}
                        >
                          <defs>
                            <linearGradient id="gInvest" x1="0" y1="0" x2="0" y2="1">
                              <stop offset="5%" stopColor="#64748b" stopOpacity={0.35} />
                              <stop offset="95%" stopColor="#64748b" stopOpacity={0.0} />
                            </linearGradient>
                            <linearGradient id="gProfit" x1="0" y1="0" x2="0" y2="1">
                              <stop offset="5%" stopColor="#c8ff00" stopOpacity={0.55} />
                              <stop offset="95%" stopColor="#c8ff00" stopOpacity={0.02} />
                            </linearGradient>
                          </defs>
                          <CartesianGrid strokeDasharray="3 3" stroke="#182235" vertical={false} />
                          <XAxis 
                            dataKey="month" 
                            tick={{ fill: "#94a3b8", fontSize: 10, fontFamily: "'JetBrains Mono'" }} 
                            tickLine={false} 
                            axisLine={{ stroke: '#182235' }} 
                          />
                          <YAxis 
                            tickFormatter={v => fmtShort(v)} 
                            tick={{ fill: "#94a3b8", fontSize: 10, fontFamily: "'JetBrains Mono'" }} 
                            tickLine={false} 
                            axisLine={false} 
                            width={62} 
                          />
                          <Tooltip content={<CustomTooltip />} />
                          <Area 
                            type="monotone" 
                            dataKey="invested" 
                            stackId="1" 
                            stroke="#64748b" 
                            strokeWidth={1.5} 
                            fill="url(#gInvest)" 
                          />
                          <Area 
                            type="monotone" 
                            dataKey="gain" 
                            stackId="1" 
                            stroke="#c8ff00" 
                            strokeWidth={2.5} 
                            fill="url(#gProfit)" 
                            dot={<CustomLastPointDot dataLength={(mode === "forward" ? forward.data : reverse.data).length} />}
                          />
                        </AreaChart>
                      </ResponsiveContainer>
                    </div>
                  </div>

                  {/* Table Container */}
                  <div className="xl:col-span-5 glass-card border border-brand/20 rounded-2xl p-4 shadow-[0_15px_40px_rgba(0,0,0,0.7)] flex flex-col justify-between">
                    <div className="flex justify-between items-center mb-3 pb-2 border-b border-zinc-800/80">
                      <span className="text-zinc-200 text-xs tracking-wider uppercase font-mono font-bold flex items-center gap-1.5">
                        <span className="w-1.5 h-3 bg-brand rounded-full"></span> BẢNG CHI TIẾT THEO NĂM
                      </span>
                      <span className="text-zinc-500 font-mono text-[10px]">Cột mốc 12th</span>
                    </div>

                    <div className="overflow-x-auto max-h-[320px] sm:max-h-[350px] border border-zinc-800/80 rounded-xl shadow-inner">
                      <table className="w-full text-left font-mono text-xs">
                        <thead className="bg-[#080c16] text-zinc-400 sticky top-0 border-b border-zinc-800 z-10">
                          <tr>
                            <th className="p-2.5">Năm</th>
                            <th className="p-2.5 text-right">Vốn đã nộp</th>
                            <th className="p-2.5 text-right">Tổng tài sản</th>
                            <th className="p-2.5 text-right text-brand">Lãi kép</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-zinc-800/50 text-zinc-300">
                          {activeYearlyData.map((row, index) => (
                            <tr key={index} className="hover:bg-[#0f172a] transition-colors">
                              <td className="p-2.5 font-bold text-white">Năm {row.year}</td>
                              <td className="p-2.5 text-right text-zinc-400">{fmtShort(row.invested)}</td>
                              <td className="p-2.5 text-right font-bold text-white">{fmtShort(row.total)}</td>
                              <td className="p-2.5 text-right">
                                <span className="text-brand font-bold">
                                  +{row.percentage.toFixed(0)}%
                                </span>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>

                </div>

              </div>
            </div>

            {/* Official Yuanta Ownership Footer Disclaimer */}
            <div className="mt-6 text-center text-zinc-500 text-[11px] font-mono leading-relaxed max-w-4xl mx-auto border-t border-zinc-900 pt-4">
              <p className="text-zinc-400 font-bold mb-1">
                © Bản quyền thuộc về Công ty Cổ phần Chứng Khoán Yuanta Việt Nam (Yuanta Securities Vietnam).
              </p>
              * Giả định tỷ suất sinh lời cố định hàng tháng và được tái đầu tư liên tục. Biến động thực tế thị trường có thể khác biệt.
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DCACalculator />);
  </script>
</body>
</html>
